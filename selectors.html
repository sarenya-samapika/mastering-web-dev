<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SELECTORS</title>
    <style>
        /* class selector */
        .red{
            background-color: red;
        }
        /* id selector */
        #green{
            background-color: green;
        }
        /* child selector */
        div > p{
            color: blue;
            background-color: yellow;
        }
        /*desendant selector */
        /*the changes in paragraph is applied because of the descendant selector*/
/*child selector only applies for direct div child elements*/
        div p{
            color: white;
            background-color: black;
        }
        /*universal selector*/
        *{
            margin: 0;
            padding: 0;
        }
        /*pseudo class selector*/
       a:visited{
        color: yellow;
       }
       a:active{
        background-color: red;
       }
       a:hover{
        background-color: blue;
       }
       p:first-child{
        background-color: aqua;
       }
    </style>

</head>
<body>
    <div class="one">
        <p>
            i am first.
        </p>
        <p>
            i am second.
        </p>
    </div>
    <div class="red">
        i am a div
        <article>
            
        <P>
            i am a paragraph!
        </P>
        </article>
    </div>
    <div id="green">
        another div
    </div>
    <a href="https://www.google.com">google</a>
</body>
</html>
