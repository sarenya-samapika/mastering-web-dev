<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transforms</title>
    <style>
        .container{
            border: 2px solid black;
            width: 80vw;
            height:80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            border: 2px solid red;
            width:100px;
            height:100px;
            background-color: beige;
            transform: scale(1.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class = "container">
        <div class = "box">BOX</div>
    </div>
</body>
</html>
