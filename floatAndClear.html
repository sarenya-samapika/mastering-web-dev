<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Float & Clear</title>
    <style>
        .cards{
            border: 2px solid black;
            display: flow-root
        }
        img{
            float:right ;
        }
        .card{
            border: 2px solid red;
        }
        .card:nth-child(2){
            background-color:aqua ;
            clear: right;
        }
    </style>
</head>
<body>
    
    
    <div class = "cards">
        <img src="photo.jpg.png" alt="." width = "230px">
        <div class = "card">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Non ad possimus suscipit nemo, quod delectus quaerat dicta ipsam molestias magnam. Provident, eum esse hic sunt vel sapiente corporis, recusandae quod aut unde, odio eos?</p>
        </div>
    </div>
    <div class = "card">card 2</div>
    <div class = "card">card 3</div>
</body>
</html>
